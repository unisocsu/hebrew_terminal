name: Build RTL Terminal

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      working-directory: ./terminal
      run: dotnet restore
    
    - name: Build
      working-directory: ./terminal
      run: dotnet build --no-restore --configuration Release
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: RTLTerminal-build
        path: terminal/bin/Release/net8.0-windows/
        retention-days: 30

  release:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Build Release
      working-directory: ./terminal
      run: dotnet build --configuration Release
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: terminal/bin/Release/net8.0-windows/RTLTerminal.exe
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref_name }}
        body: |
          RTL Terminal Release
          
          Download `RTLTerminal.exe` to run the terminal.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
