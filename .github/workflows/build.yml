name: Build RTL Terminal

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '6.0.x'
    
    - name: Restore dependencies
      working-directory: ./terminal
      run: dotnet restore
    
    - name: Build
      working-directory: ./terminal
      run: dotnet build --no-restore --configuration Release
    
    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: RTLTerminal-build
        path: terminal/bin/Release/net6.0-windows/
        retention-days: 30

  release:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '6.0.x'
    
    - name: Build Release
      working-directory: ./terminal
      run: dotnet build --configuration Release
    
    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        body: |
          RTL Terminal Release
          Download the artifact to get the compiled executable.
        draft: false
        prerelease: false
    
    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: terminal/bin/Release/net6.0-windows/RTLTerminal.exe
        asset_name: RTLTerminal.exe
        asset_content_type: application/octet-stream
